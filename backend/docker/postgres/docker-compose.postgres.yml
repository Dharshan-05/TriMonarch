version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trimonarch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trimonarch_erp}
      POSTGRES_USER: ${POSTGRES_USER:-trimonarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - trimonarch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trimonarch} -d $${POSTGRES_DB:-trimonarch_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: trimonarch_postgres_data

networks:
  trimonarch-network:
    name: trimonarch-network
