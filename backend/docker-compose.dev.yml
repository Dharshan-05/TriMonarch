version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trimonarch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trimonarch_erp}
      POSTGRES_USER: ${POSTGRES_USER:-trimonarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      DATABASE_NAME: ${POSTGRES_DB:-trimonarch_erp}
      DATABASE_USER: ${POSTGRES_USER:-trimonarch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - trimonarch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trimonarch} -d $${POSTGRES_DB:-trimonarch_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trimonarch-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-8000}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-trimonarch_erp}
      DATABASE_USER: ${POSTGRES_USER:-trimonarch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-development-super-secret-key-32-chars-long}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-key-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-key-32-chars-long}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trimonarch-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 8000) + '/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    name: trimonarch_postgres_data

networks:
  trimonarch-network:
    name: trimonarch-network
